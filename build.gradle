plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = 'com.sst'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // 复用 MineFargo 仓库的本地依赖 jar（curios 等）
    flatDir {
        dir '../MineFargo/libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Curios：GUI 读取魂石槽位需要
    implementation fg.deobf("blank:curios-1.20.1:1")

    // MineFargo 桩 jar：仅用于让 Mixin 注解处理器解析到目标类
    // （MyGoUtil.hasSupernatural），运行时由真实 MineFargo 提供。
    compileOnly files('libs/minefargo-stub.jar')
    // AE2 桩类（AbstractTableRenderer/AEKey/GenericStack 等）：
    // 只在编译阶段用来引用 AE2 类型以便 Mixin 注解处理器/Java 编译通过，
    // 运行时由真实 Applied Energistics 2 提供。
    compileOnly files('libs/ae2-stub.jar')
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

apply plugin: 'org.spongepowered.mixin'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// ===== AE2/MineFargo stub 编译任务：stubsrc → libs/*.jar（仅编译，不含依赖）=====
// 不直接把 stubsrc 放进 sourceSets.main，否则 stub 类会被打进最终 jar，
// 运行时可能和真实 AE2/MineFargo class 冲突。
tasks.register('compileAe2Stub', JavaCompile) {
    source = fileTree('stubsrc') { include 'appeng/**/*.java' }
    classpath = files()
    options.encoding = 'UTF-8'
    options.release = 17
    destinationDirectory = layout.buildDirectory.dir('stub-classes/ae2')
    // stub 内部自包含（不依赖 Forge MC 映射——stub 源码里用 fqn 引用的 MC 类会通过 compileJava classpath）
    // 所以把它接到 compileJava 的 classpath
    doFirst {
        classpath = tasks.compileJava.classpath
    }
}
// 注意：不能用 Jar 任务，否则 MixinGradle 插件会给所有 Jar 任务注入
// addMixinsToPackageAe2Stub → compileJava 的依赖，形成循环：
//   compileJava → packageAe2Stub → addMixinsToPackageAe2Stub → compileJava
// 所以改用 Zip 任务打 stub jar（内容和 jar 一致，只是不触发 mixin 自动织入）。
tasks.register('packageAe2Stub', Zip) {
    dependsOn compileAe2Stub
    from compileAe2Stub
    archiveBaseName = 'ae2-stub'
    archiveExtension = 'jar'
    destinationDirectory = file('libs')
    doLast {
        copy {
            from archiveFile.get().asFile
            into 'libs'
            rename 'ae2-stub.*', 'ae2-stub.jar'
        }
    }
}
// 仅当 ae2-stub.jar 不存在时才触发 stub 构建（避免每次都绕一遍）
if (!file('libs/ae2-stub.jar').exists()) {
    tasks.compileJava.dependsOn packageAe2Stub
}
